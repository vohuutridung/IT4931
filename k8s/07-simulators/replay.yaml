apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-reddit
  namespace: social-pipeline
  labels:
    app: replay-reddit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay-reddit
  template:
    metadata:
      labels:
        app: replay-reddit
    spec:
      containers:
        - name: simulator
          image: social-python:0.1.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - ingestion.simulator
            - --platform
            - reddit
            - --source
            - data/reddit_data/sample_data
            - --rate
            - "20"
            - --loop
            - "true"
            - --dedupe
            - "true"
            - --kafka-bootstrap
            - kafka-service:9092
          ports:
            - containerPort: 9101
              name: metrics
          envFrom:
            - configMapRef:
                name: social-pipeline-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
              readOnly: true

      volumes:
        - name: data-volume
          hostPath:
            path: /social-pipeline/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: replay-reddit-service
  namespace: social-pipeline
spec:
  ports:
    - port: 9101
      targetPort: 9101
  selector:
    app: replay-reddit
---
