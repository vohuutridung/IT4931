apiVersion: batch/v1
kind: Job
metadata:
  name: replay-reddit
  namespace: social-pipeline
  labels:
    app: replay-reddit
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: replay-reddit
    spec:
      restartPolicy: Never
      containers:
        - name: simulator
          image: social-python:0.1.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - ingestion.simulator
            - --platform
            - reddit
            - --source
            - data/reddit_data/raw_data
            - --rate
            - "20"
            - --kafka-bootstrap
            - kafka-service:9092
          envFrom:
            - configMapRef:
                name: social-pipeline-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
              readOnly: true

      volumes:
        - name: data-volume
          hostPath:
            path: /social-pipeline/data
            type: Directory
---
