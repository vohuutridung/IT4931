apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-store-writer
  namespace: social-pipeline
  labels:
    app: object-store-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-store-writer
  template:
    metadata:
      labels:
        app: object-store-writer
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka and MinIO..."
              until nc -z kafka-service 9092; do sleep 2; done
              until nc -z minio-service 9000; do sleep 2; done
              echo "Infra ready!"
      containers:
        - name: writer
          image: social-python:0.1.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - batch.object_store_writer
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
          env:
            - name: KAFKA_CONSUMER_GROUP
              value: "batch-consumer"
            - name: CONSUMER_FLUSH_SIZE
              value: "500"
            - name: CONSUMER_FLUSH_INTERVAL
              value: "30"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
