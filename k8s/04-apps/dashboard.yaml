apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: social-pipeline
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: dashboard-source
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: dashboard-source
          hostPath:
            path: /social-pipeline/dashboard
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: social-pipeline
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: dashboard
