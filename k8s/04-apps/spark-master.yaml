apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: social-pipeline
  labels:
    app: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: social-spark:3.5.1
          imagePullPolicy: Never
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
          ports:
            - containerPort: 7077
              name: master
            - containerPort: 8080
              name: ui
          envFrom:
            - configMapRef:
                name: social-pipeline-config
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: SPARK_LOCAL_IP
              value: "0.0.0.0"
            - name: SPARK_MASTER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-service
  namespace: social-pipeline
spec:
  ports:
    - port: 7077
      targetPort: 7077
      name: master
    - port: 8080
      targetPort: 8080
      name: ui
  selector:
    app: spark-master
