apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: social-pipeline
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Redis and Elasticsearch..."
              until nc -z redis-service 6379; do sleep 2; done
              until nc -z elasticsearch-service 9200; do sleep 2; done
              echo "Infra ready!"
        - name: serving-init
          image: social-python:0.1.0
          command: ["python", "-m", "serving.es_indexer", "--ensure"]
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
      containers:
        - name: api
          image: social-python:0.1.0
          command:
            - uvicorn
            - api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: social-pipeline
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api
