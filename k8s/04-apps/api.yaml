apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: social-pipeline
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Postgres and ClickHouse..."
              until nc -z postgres-service 5432; do sleep 2; done
              until nc -z clickhouse-service 8123; do sleep 2; done
              echo "Infra ready!"
        - name: serving-init
          image: social-python:0.1.0
          imagePullPolicy: Never
          command: ["python", "-m", "serving.es_indexer", "--ensure"]
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
      containers:
        - name: api
          image: social-api-ml:0.1.0
          imagePullPolicy: Never
          command:
            - uvicorn
            - api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
          volumeMounts:
            - name: virality-artifacts
              mountPath: /app/ml/virality/artifacts
            - name: sentiment-artifacts
              mountPath: /app/ml/sentiment/artifacts
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: virality-artifacts
          persistentVolumeClaim:
            claimName: virality-artifacts-pvc
        - name: sentiment-artifacts
          persistentVolumeClaim:
            claimName: sentiment-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: social-pipeline
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api
