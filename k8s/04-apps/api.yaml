apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: social-pipeline
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-for-infra
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Redis and Elasticsearch..."
              until nc -z redis-service 6379; do sleep 2; done
              until nc -z elasticsearch-service 9200; do sleep 2; done
              echo "Infra ready!"
        - name: serving-init
          image: social-python:0.1.0
          imagePullPolicy: Never
          command: ["python", "-m", "serving.es_indexer", "--ensure"]
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
        - name: init-sentiment-artifacts
          image: social-api-ml:0.1.0
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /pvc/fine_tuned_phobert/config.json ]; then
                echo "Copying PhoBERT model to PVC..."
                cp -rp /app/ml/sentiment/artifacts/. /pvc/
                echo "Done."
              else
                echo "Sentiment artifacts already present, skipping."
              fi
          volumeMounts:
            - name: sentiment-artifacts
              mountPath: /pvc
      containers:
        - name: api
          image: social-api-ml:0.1.0
          imagePullPolicy: Never
          command:
            - uvicorn
            - api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: social-pipeline-config
            - secretRef:
                name: social-pipeline-secrets
          volumeMounts:
            - name: virality-artifacts
              mountPath: /app/ml/virality/artifacts
            - name: sentiment-artifacts
              mountPath: /app/ml/sentiment/artifacts
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: virality-artifacts
          persistentVolumeClaim:
            claimName: virality-artifacts-pvc
        - name: sentiment-artifacts
          persistentVolumeClaim:
            claimName: sentiment-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: social-pipeline
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api
