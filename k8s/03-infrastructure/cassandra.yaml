apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: social-pipeline
  labels:
    app: cassandra
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          ports:
            - containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "social-lambda"
            - name: MAX_HEAP_SIZE
              value: "256M"
            - name: HEAP_NEWSIZE
              value: "64M"
          volumeMounts:
            - mountPath: /var/lib/cassandra
              name: cassandra-storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["cqlsh", "-e", "describe keyspaces"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
      volumes:
        - name: cassandra-storage
          persistentVolumeClaim:
            claimName: cassandra-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-service
  namespace: social-pipeline
spec:
  ports:
    - port: 9042
      targetPort: 9042
  selector:
    app: cassandra
