apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: social-pipeline
  labels:
    app: clickhouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_DB
              value: "social"
            - name: CLICKHOUSE_USER
              value: "social"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: social-pipeline-secrets
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/clickhouse
              name: clickhouse-storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: clickhouse-storage
          persistentVolumeClaim:
            claimName: clickhouse-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-service
  namespace: social-pipeline
spec:
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9002
      targetPort: 9000
      name: native
  selector:
    app: clickhouse
