# Kafka in KRaft mode — không cần Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: social-pipeline
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.6.1
          ports:
            - containerPort: 9092
          env:
            # KRaft mode — không cần Zookeeper
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: social-pipeline
spec:
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: social-pipeline
spec:
  backoffLimit: 5
  template:
    spec:
      containers:
        - name: kafka-init
          image: bitnamilegacy/kafka:3.6.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until kafka-topics.sh --bootstrap-server kafka-service:9092 --list > /dev/null 2>&1; do
                sleep 3
              done
              echo "Creating Kafka topics..."
              kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic "${KAFKA_TOPIC_REDDIT:-social.reddit.posts}" --partitions 3 --replication-factor 1
              kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic "${KAFKA_TOPIC_FACEBOOK:-social.facebook.posts}" --partitions 3 --replication-factor 1
              kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic "${KAFKA_TOPIC_INSTAGRAM:-social.instagram.posts}" --partitions 3 --replication-factor 1
              kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic "${KAFKA_TOPIC_ENRICHED:-social.enriched.posts}" --partitions 3 --replication-factor 1
              kafka-topics.sh --bootstrap-server kafka-service:9092 --create --if-not-exists --topic "${KAFKA_TOPIC_DLQ:-social.dlq}" --partitions 1 --replication-factor 1
              echo "Kafka topics initialization completed."
          envFrom:
            - configMapRef:
                name: social-pipeline-config
      restartPolicy: OnFailure
