apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: social-pipeline
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-service:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: social-pipeline
spec:
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: social-pipeline
spec:
  backoffLimit: 5
  template:
    spec:
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.6.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until kafka-topics --bootstrap-server kafka-service:9092 --list > /dev/null 2>&1; do
                sleep 2
              done
              echo "Creating Kafka topics..."
              kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic social.reddit.posts --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic social.facebook.posts --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic social.instagram.posts --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic social.enriched.posts --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka-service:9092 --create --if-not-exists --topic social.dlq --partitions 1 --replication-factor 1
              echo "Kafka topics initialization completed."
      restartPolicy: OnFailure
