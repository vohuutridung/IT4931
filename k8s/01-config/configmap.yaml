apiVersion: v1
kind: ConfigMap
metadata:
  name: social-pipeline-config
  namespace: social-pipeline
data:
  ENV: "dev"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  S3_ENDPOINT: "http://minio-service:9000"
  S3_BUCKET: "social-lake"
  S3_REGION: "us-east-1"
  S3_PATH_STYLE_ACCESS: "true"
  STORAGE_RAW_BASE: "s3a://social-lake/data/raw"
  STORAGE_DISCARDED_BASE: "s3a://social-lake/data/discarded"
  STORAGE_BATCH_VIEWS_BASE: "s3a://social-lake/data/batch_views"
  STREAM_STARTING_OFFSETS: "earliest"
  STREAM_TRIGGER_SECS: "5"
  SPEED_WRITE_BATCH_SIZE: "500"
  BATCH_INPUT_PARTITIONS: "2"
  BATCH_SHUFFLE_PARTITIONS: "2"
  SPARK_MASTER: "spark://spark-master-service:7077"
  AIRFLOW_SPARK_MASTER: "spark://spark-master-service:7077"
  PYTHONPATH: "/app"
  PYTHONUNBUFFERED: "1"
  PIPELINE_DIR: "/opt/social_pipeline"
  VIRALITY_ARTIFACTS_DIR: "/app/ml/virality/artifacts"
  VIRALITY_RETRAIN_CRON: "0 2 * * 1"
  SENTIMENT_ARTIFACTS_DIR: "/app/ml/sentiment/artifacts"
  SENTIMENT_RETRAIN_CRON: "0 3 * * 1"
  HF_HOME: "/tmp/huggingface"
  CLICKHOUSE_HOST: "clickhouse-service"
  CLICKHOUSE_DATABASE: "social"
  CLICKHOUSE_USER: "social"
  REALTIME_WINDOW_HOURS: "3000"
  ES_HOST: "http://elasticsearch-service:9200"
  ES_BATCH_INDEX: "social_batch_views"
  ES_REALTIME_INDEX: "social_realtime_views"
  ES_BATCH_ALIAS: "batch_current"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"


