apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: social-pipeline
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: api
        metrics_path: /metrics
        static_configs:
          - targets: ["api-service:8000"]
      - job_name: simulator
        static_configs:
          - targets:
              - "replay-reddit-service:9101"
              - "replay-facebook-service:9101"
              - "replay-instagram-service:9101"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: social-pipeline
  labels:
    app: prometheus
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.1
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: social-pipeline
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
