global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: simulator
    static_configs:
      - targets:
          - "replay-reddit:9101"
          - "replay-facebook:9101"
          - "replay-instagram:9101"
