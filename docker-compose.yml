x-common-env: &common-env
  ENV: ${ENV:-dev}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-social-lake}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PATH_STYLE_ACCESS: "true"
  STORAGE_RAW_BASE: s3a://${S3_BUCKET:-social-lake}/data/raw
  STORAGE_BATCH_VIEWS_BASE: s3a://${S3_BUCKET:-social-lake}/data/batch_views
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CASSANDRA_HOSTS: cassandra
  CASSANDRA_KEYSPACE: social_lambda
  ES_HOST: http://elasticsearch:9200
  ES_BATCH_INDEX: social_batch_views
  ES_REALTIME_INDEX: social_realtime_views
  ES_BATCH_ALIAS: batch_current
  CLICKHOUSE_HOST: http://clickhouse:8123
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-social_warehouse}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-social}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-social}
  STREAM_STARTING_OFFSETS: ${STREAM_STARTING_OFFSETS:-latest}
  STREAM_TRIGGER_SECS: ${STREAM_TRIGGER_SECS:-5}
  SPEED_WRITE_BATCH_SIZE: ${SPEED_WRITE_BATCH_SIZE:-500}

x-airflow-env: &airflow-env
  <<: *common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  SPARK_HOME: /opt/spark
  PIPELINE_DIR: /opt/social_pipeline
  PYTHONPATH: /opt/social_pipeline

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic social.reddit.posts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic social.facebook.posts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic social.instagram.posts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic social.enriched.posts --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic social.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["debug"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-social-lake}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc ls "local/$$S3_BUCKET"
    restart: "no"

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: social-spark:3.5.3
    container_name: spark-master
    ports:
      - "${SPARK_MASTER_UI_HOST_PORT:-8081}:8080"
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
    environment:
      <<: *common-env
      SPARK_NO_DAEMONIZE: "true"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: social-spark:3.5.3
    container_name: spark-worker
    depends_on:
      - spark-master
    ports:
      - "${SPARK_WORKER_UI_HOST_PORT:-8083}:8081"
    environment:
      <<: *common-env
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4G
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    profiles: ["enrichment", "anomaly"]
    ports:
      - "${CASSANDRA_HOST_PORT:-9042}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: social-lambda
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    profiles: ["debug"]
    depends_on:
      - elasticsearch
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    profiles: ["warehouse"]
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9002}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-social_warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-social}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-social}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:15
    container_name: postgres
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    profiles: ["orchestration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    volumes:
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow connections add spark_default --conn-type spark --conn-host 'local[2]' || true
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    profiles: ["orchestration"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_WEBSERVER_HOST_PORT:-8082}:8080"
    environment:
      <<: *airflow-env
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./:/opt/social_pipeline:ro
      - airflow_logs:/opt/airflow/logs
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    profiles: ["orchestration"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./:/opt/social_pipeline:ro
      - airflow_logs:/opt/airflow/logs
    command: scheduler

  object-store-writer:
    build:
      context: .
      dockerfile: Dockerfile
    image: social-python:latest
    container_name: object-store-writer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      KAFKA_CONSUMER_GROUP: batch-consumer
      CONSUMER_FLUSH_SIZE: ${CONSUMER_FLUSH_SIZE:-500}
      CONSUMER_FLUSH_INTERVAL: ${CONSUMER_FLUSH_INTERVAL:-30}
    command: ["python", "-m", "batch.object_store_writer"]
    restart: unless-stopped

  replay-reddit:
    image: social-python:latest
    profiles: ["replay"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      object-store-writer:
        condition: service_started
      speed:
        condition: service_started
    volumes:
      - ./data:/app/data:ro
    environment:
      <<: *common-env
      REPLAY_RATE_PER_SEC: ${REPLAY_RATE_PER_SEC:-20}
      REPLAY_DEDUPE: ${REPLAY_DEDUPE:-true}
    command:
      - python
      - -m
      - ingestion.simulator
      - --platform
      - reddit
      - --rate
      - ${REPLAY_RATE_PER_SEC:-20}
      - --dedupe
      - ${REPLAY_DEDUPE:-true}
      - --kafka-bootstrap
      - kafka:29092
    restart: "no"

  replay-facebook:
    image: social-python:latest
    profiles: ["replay"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      object-store-writer:
        condition: service_started
      speed:
        condition: service_started
    volumes:
      - ./data:/app/data:ro
    environment:
      <<: *common-env
      REPLAY_RATE_PER_SEC: ${REPLAY_RATE_PER_SEC:-20}
      REPLAY_DEDUPE: ${REPLAY_DEDUPE:-true}
    command:
      - python
      - -m
      - ingestion.simulator
      - --platform
      - facebook
      - --rate
      - ${REPLAY_RATE_PER_SEC:-20}
      - --dedupe
      - ${REPLAY_DEDUPE:-true}
      - --kafka-bootstrap
      - kafka:29092
    restart: "no"

  replay-instagram:
    image: social-python:latest
    profiles: ["replay"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      object-store-writer:
        condition: service_started
      speed:
        condition: service_started
    volumes:
      - ./data:/app/data:ro
    environment:
      <<: *common-env
      REPLAY_RATE_PER_SEC: ${REPLAY_RATE_PER_SEC:-20}
      REPLAY_DEDUPE: ${REPLAY_DEDUPE:-true}
    command:
      - python
      - -m
      - ingestion.simulator
      - --platform
      - instagram
      - --rate
      - ${REPLAY_RATE_PER_SEC:-20}
      - --dedupe
      - ${REPLAY_DEDUPE:-true}
      - --kafka-bootstrap
      - kafka:29092
    restart: "no"

  speed:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: social-spark:3.5.3
    container_name: speed
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      <<: *common-env
      SPARK_MASTER: spark://spark-master:7077
      PYTHONPATH: /app
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - /app/speed/streaming_job.py
    restart: on-failure

  serving-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: social-python:latest
    container_name: serving-init
    depends_on:
      - elasticsearch
    environment:
      <<: *common-env
    command: ["python", "-m", "serving.es_indexer", "--ensure"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: social-api:latest
    container_name: api
    depends_on:
      - serving-init
      - redis
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      <<: *common-env
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    depends_on:
      - api
    ports:
      - "${DASHBOARD_HOST_PORT:-8084}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro

  ml-anomaly:
    build:
      context: .
      dockerfile: Dockerfile
    image: social-ml:latest
    container_name: ml-anomaly
    profiles: ["anomaly"]
    depends_on:
      - api
      - cassandra
    environment:
      <<: *common-env
    command: ["python", "-m", "ml.anomaly_detector"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  minio_data:
  clickhouse_data:
  cassandra_data:
  es_data:
  postgres_data:
  airflow_logs:
  grafana_data:

networks:
  default:
    name: lambda-net
    driver: bridge
